name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prisma generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
      - run: yarn tsc --noEmit
      - run: yarn lint
      - run: yarn vitest run
      # xlsx (ReDoS) is a devDependency used only by scripts/parse-ods.ts on a trusted local workbook.
      - run: yarn npm audit --severity high --exclude xlsx

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
