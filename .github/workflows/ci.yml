name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prisma generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
      - run: yarn tsc --noEmit
      - run: yarn lint
      - run: yarn vitest run
      # xlsx (ReDoS) is a devDependency used only by scripts/parse-ods.ts on a trusted local workbook.
      - run: yarn npm audit --severity high --exclude xlsx

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the whole history. gitleaks-action builds a `<first commit>^..HEAD`
      # range on push, which fails when the first commit is the repository's root.
      - name: Scan history with gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact -v --exit-code 2
