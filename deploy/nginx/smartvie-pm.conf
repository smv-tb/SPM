# Reverse proxy for Smartvie PM (S6.1). Copy to /etc/nginx/conf.d/ on the proxy
# machine, replace the three <...> values, then `nginx -t && systemctl reload nginx`.
#
# On the app server set TRUSTED_PROXY_IPS to this machine's address, so
# server-wrapper.mjs believes the X-Forwarded-For header set below (and only
# from here). The app overwrites X-Real-IP itself.

# Per-IP limits. The app has its own limits too; these stop floods earlier.
limit_req_zone $binary_remote_addr zone=sv_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sv_api:10m   rate=300r/m;
limit_req_status 429;

upstream smartvie_app {
    server <app-server-ip>:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name <app.example.com>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <app.example.com>;

    ssl_certificate     /etc/letsencrypt/live/<app.example.com>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<app.example.com>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:sv_tls:10m;
    ssl_session_tickets off;

    server_tokens off;

    # Statement uploads are capped at 5 MB in the app; leave headroom for the
    # multipart wrapper and refuse anything larger before it reaches Node.
    client_max_body_size 6m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    # Security headers (HSTS, CSP, frame options...) come from the app.

    # Sign-in: the hardest-throttled endpoint. The app also counts failures per
    # IP and per account; this only slows a flood.
    location = /api/auth/callback/credentials {
        limit_req zone=sv_login burst=5 nodelay;
        include /etc/nginx/snippets/smartvie-proxy.conf;
        proxy_pass http://smartvie_app;
    }

    # Hermes (MCP). Optionally restrict to the agent's address:
    #   allow <agent-ip>; deny all;
    location /api/hermes {
        limit_req zone=sv_api burst=50 nodelay;
        include /etc/nginx/snippets/smartvie-proxy.conf;
        proxy_pass http://smartvie_app;
        # MCP Streamable HTTP can stream: do not buffer.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=sv_api burst=100 nodelay;
        include /etc/nginx/snippets/smartvie-proxy.conf;
        proxy_pass http://smartvie_app;
    }

    location / {
        include /etc/nginx/snippets/smartvie-proxy.conf;
        proxy_pass http://smartvie_app;
    }
}
