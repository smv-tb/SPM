# Shared by every location in smartvie-pm.conf. Install as
# /etc/nginx/snippets/smartvie-proxy.conf.
#
# $remote_addr, not $proxy_add_x_forwarded_for: this is the edge, so discard
# whatever chain the client sent rather than appending to it.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_read_timeout 60s;
